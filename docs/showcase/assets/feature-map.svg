<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">以患者为中心的临床与影像 AI 工作台</title><desc id="desc">功能示意图：临床事实、受控影像阅片、持久化 AI 任务与带来源的患者助手围绕同一患者工作区连接。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f78"/></marker></defs><rect width="1600" height="900" fill="#f4f7f9"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
