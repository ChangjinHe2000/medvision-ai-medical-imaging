<text x="64" y="124" font-size="48" font-weight="700" fill="#132b3a" text-anchor="start">一位患者，连接临床事实、影像与 AI 结果</text>
<text x="64" y="169" font-size="23" font-weight="400" fill="#526976" text-anchor="start">从查看记录到追溯模型输出，让关键工作流在同一个工作区衔接。</text>
