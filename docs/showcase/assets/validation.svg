<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">真实数据与工程验证范围</title><desc id="desc">截至2026年10月5日，202个可见患者身份，其中100有临床事实、42有影像含合成病例、52仅有就诊、8仅有基本信息。真实影像20名CT患者共5130切片、21名胸片患者；20独立胸片完成CUDA推理、5独立CT完成CUDA分割。验证范围为工程链路，不代表医学诊断准确率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f78"/></marker></defs><rect width="1600" height="900" fill="#f4f7f9"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
