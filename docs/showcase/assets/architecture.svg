<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">MedVision 系统架构与数据流</title><desc id="desc">HAPI FHIR 与 OpenMRS 接入 Spring Boot 和 MySQL；Orthanc 通过授权网关进入 OHIF；FastAPI CPU 或 CUDA 推理形成持久任务和结果，Vue 与 Copilot 展示可引用的患者事实。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f78"/></marker></defs><rect width="1600" height="900" fill="#f4f7f9"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
